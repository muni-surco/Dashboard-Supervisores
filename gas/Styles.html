<style>
/* ─── Design System Tokens · Municipalidad de Surco · C4 ─── */
:root {
  /* Brand */
  --cp:  #005ea5;   /* Primary */
  --cpd: #003D6B;   /* Primary Dark */
  --cpl: #E6EEF5;   /* Primary Light */
  --cs:  #00C9A7;   /* Secondary / Teal */
  --csd: #00A88A;   /* Secondary Dark */
  --csl: #E0FAF5;   /* Secondary Light */
  --ca:  #F5A623;   /* Accent / Amber */
  /* Status */
  --cd:  #E03E3E;   /* Danger */
  --cdl: #FDEAEA;
  --cw:  #F5A623;   /* Warning */
  --cwl: #FEF3DC;
  --cok: #27AE60;   /* Success */
  --cokl:#E8F7EE;
  --ci:  #2F80ED;   /* Info */
  --cil: #EBF3FD;
  /* Neutrals */
  --g9: #1A1A2E;
  --g7: #4A4A6A;
  --g5: #8888AA;
  --g3: #D0D5E8;
  --g1: #F4F6FB;
  --wh: #FFFFFF;
  /* Type */
  --font: 'Chivo', 'Segoe UI', system-ui, sans-serif;
  --txs: 11px;  --tsm: 13px;  --tbase: 15px;
  --tmd: 17px;  --tlg: 20px;  --txl: 24px; --t2: 30px;
  /* Spacing */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
  --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  /* Radius */
  --rsm:4px; --rmd:8px; --rlg:12px; --rxl:16px; --rfull:9999px;
  /* Shadows */
  --shsm: 0 1px 3px rgba(0,0,0,.08);
  --shmd: 0 4px 12px rgba(0,0,0,.10);
  --shlg: 0 8px 24px rgba(0,0,0,.14);
  /* Layout */
  --sb: 220px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font);
  background: var(--g1);
  color: var(--g9);
  display: flex;
  min-height: 100vh;
  overflow-x: clip;
  font-size: var(--tbase);
}

/* ── SIDEBAR ── */
.sb {
  width: var(--sb);
  background: var(--cpd);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
}
.sb::-webkit-scrollbar { width: 4px; }
.sb::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

.sb-head {
  padding: var(--s4) var(--s3) var(--s3);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: relative;
}
.sb-logo { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s1); }
.sb-escudo {
  width: 38px; height: 38px;
  background: var(--cs);
  border-radius: var(--rmd);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 14px;
  color: var(--cpd);
  letter-spacing: -.5px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,201,167,.35);
}
.sb-name h2 { color: #fff; font-size: var(--tsm); font-weight: 700; line-height: 1.2; }
.sb-name p  { color: var(--cs); font-size: var(--txs); text-transform: uppercase; letter-spacing: .8px; margin-top: 2px; opacity: .8; }

.sb-sub {
  font-size: var(--txs); color: rgba(255,255,255,.3);
  text-transform: uppercase; letter-spacing: .8px;
  padding: var(--s4) var(--s3) var(--s2);
  font-weight: 700;
}
.nav-item {
  display: flex; align-items: center; gap: var(--s2);
  padding: 9px var(--s3);
  cursor: pointer;
  border-left: 3px solid transparent;
  color: rgba(255,255,255,.5);
  font-size: var(--tsm);
  transition: all .15s;
}
.nav-item i { flex-shrink: 0; opacity: .6; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item:hover i { opacity: 1; }
.nav-item.active { background: rgba(0,201,167,.12); border-left-color: var(--cs); color: #fff; }
.nav-item.active i { opacity: 1; }

/* ── MAIN ── */
.main { margin-left: 64px; flex: 1; display: flex; flex-direction: column; }

/* ── SIDEBAR PLEGABLE (hover expand, superpuesto sobre el contenido) ── */
.sb { transition: width .2s cubic-bezier(.4,0,.2,1); overflow-x: hidden; }
body.sb-collapsed { --sb: 64px; }
body.sb-collapsed:has(.sb:hover) { --sb: 220px; }
body.sb-collapsed:has(.sb:hover) .sb { box-shadow: 4px 0 16px rgba(0,0,0,.25); }
body.sb-collapsed .sb-name,
body.sb-collapsed .sb-sub { display: none; }
body.sb-collapsed:has(.sb:hover) .sb-name,
body.sb-collapsed:has(.sb:hover) .sb-sub { display: block; }
body.sb-collapsed .sb-logo { justify-content: center; }
body.sb-collapsed:has(.sb:hover) .sb-logo { justify-content: flex-start; }
body.sb-collapsed .sb-head { padding: var(--s3) var(--s1) var(--s2); }
body.sb-collapsed:has(.sb:hover) .sb-head { padding: var(--s4) var(--s3) var(--s3); }
body.sb-collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; border-left-width: 0; }
body.sb-collapsed:has(.sb:hover) .nav-item { justify-content: flex-start; padding-left: var(--s3); padding-right: var(--s3); border-left-width: 3px; }
body.sb-collapsed .nav-label { display: none; }
body.sb-collapsed:has(.sb:hover) .nav-label { display: inline; }
.hidden { display: none !important; }

/* ── TOPBAR ── */
.topbar {
  background: var(--wh);
  border-bottom: 1px solid var(--g3);
  padding: var(--s3) var(--s5);
  display: flex; flex-direction: column; align-items: stretch; gap: var(--s2);
  flex-shrink: 0;
  position: sticky; top: 0; z-index: 50;
  box-shadow: var(--shsm);
}
.topbar-title { flex: none; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.topbar-title h1 { font-size: var(--tmd); font-weight: 700; color: var(--cp); }
.topbar-title p  { font-size: var(--txs); color: var(--g5); margin-top: 2px; }
.topbar-filters { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }

.tb-select, .tb-date {
  background: var(--g1);
  border: 1px solid var(--g3);
  border-radius: var(--rmd);
  padding: 7px 10px;
  font-size: var(--tsm);
  font-family: var(--font);
  color: var(--g9);
  cursor: pointer;
  outline: none;
  transition: border-color .15s;
}
.tb-select:focus, .tb-date:focus { border-color: var(--cp); }

.date-range {
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.date-range span {
  font-size: var(--txs);
  color: var(--g5);
  font-weight: 600;
}

.date-source {
  font-size: var(--txs);
  color: var(--g5);
  white-space: nowrap;
}
.date-source strong {
  color: var(--cp);
  font-weight: 700;
}

.badge-period {
  background: var(--cp);
  color: #fff;
  padding: 6px var(--s4);
  border-radius: var(--rfull);
  font-size: var(--tbase);
  font-weight: 700;
  letter-spacing: .3px;
  margin-left: auto;
  white-space: nowrap;
}

.tb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--csl);
  border: 1px solid var(--csd);
  color: var(--csd);
  border-radius: var(--rmd);
  padding: 7px 12px;
  font-size: var(--tsm);
  font-family: var(--font);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.tb-btn:hover { background: var(--csd); color: #fff; }

/* ── CONTENT ── */
.content { padding: var(--s5); flex: 1; }
.section-panel { display: none; }
.section-panel.active { display: block; }
.section-header { margin-bottom: var(--s4); }
.section-header h2 { font-size: var(--txl); font-weight: 700; color: var(--cp); }
.section-header p  { font-size: var(--tsm); color: var(--g5); margin-top: 3px; }

/* ── KPI ROW ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--s3);
  margin-bottom: var(--s4);
}
/* ── STAT CARD (KPI) ── */
.sc2 {
  background: var(--wh);
  border: 1px solid var(--g3);
  border-radius: var(--rlg);
  padding: var(--s5);
  box-shadow: var(--shsm);
  display: flex;
  align-items: center;
  gap: var(--s4);
  transition: box-shadow .2s, transform .2s;
}
.sc2:hover { box-shadow: var(--shmd); transform: translateY(-1px); }
.si {
  width: 48px; height: 48px;
  border-radius: var(--rmd);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.si.t { background: var(--cpl); }
.si.n { background: var(--csl); }
.si.r { background: #FDE8E8; }
.si.a { background: #FEF3CD; }
.sv { font-size: var(--t2); font-weight: 700; color: var(--g9); line-height: 1; }
.sl { font-size: var(--tsm); color: var(--g5); margin-top: 2px; }
.str { font-size: var(--txs); margin-top: 4px; font-weight: 600; }
.str.up { color: var(--cok); }
.str.warn { color: var(--cw); }
.str.dn { color: var(--cd); }
.kpi-pill {
  display: inline-flex; align-items: center; gap: var(--s1);
  padding: 3px 8px;
  border-radius: var(--rfull);
  font-size: var(--txs); font-weight: 700;
  margin-top: var(--s2);
}
.kpi-pill.verde   { background: var(--cokl); color: #1a7a45; }
.kpi-pill.amarillo{ background: var(--cwl);  color: #9C6800; }
.kpi-pill.rojo    { background: var(--cdl);  color: #b52020; }

.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot.verde   { background: var(--cok); }
.dot.amarillo{ background: var(--cw); }
.dot.rojo    { background: var(--cd); }

/* ── CARDS ── */
.card {
  background: var(--wh);
  border-radius: var(--rlg);
  padding: var(--s5);
  border: 1px solid var(--g3);
  box-shadow: var(--shsm);
}
.card-title {
  font-size: var(--tmd); font-weight: 700;
  color: var(--cp);
  margin-bottom: var(--s4);
  display: flex; align-items: center; justify-content: space-between;
  letter-spacing: -.1px;
}
.card-title .badge-cat {
  font-size: var(--txs); font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--rfull);
  background: var(--csl); color: var(--csd);
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-bottom: var(--s3); }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s3); margin-bottom: var(--s3); }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: var(--s3); margin-bottom: var(--s3); }
.chart-wrap { position: relative; width: 100%; }
.chart-wrap svg, .chart-wrap .apexcharts-canvas { max-width: 100%; }
.mb14 { margin-bottom: var(--s3); }

/* ── TÍTULOS DE SECCIÓN ── */
.panel-sec {
  font-size: var(--tsm); font-weight: 700; color: var(--cp);
  text-transform: uppercase; letter-spacing: .5px;
  margin: var(--s6) 0 var(--s3);
  display: flex; align-items: center; gap: var(--s2);
}
.panel-sec::after { content: ''; flex: 1; height: 1px; background: var(--g3); }

/* ── RESPONSIVE ── */
@media (max-width: 900px){
  .kpi-row, .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr !important; }
  .sup-card-group { grid-template-columns: 1fr !important; }
}
.mapa { height: 360px; border-radius: var(--rmd); overflow: hidden; position: relative; z-index: 0; }
.mapa .leaflet-container { font-family: inherit; }
.punto-delito { position:relative;width:24px;height:34px;color:var(--pd-c);filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
.punto-delito .pin-icon { position:absolute;top:3px;left:0;right:0;height:20px;display:flex;align-items:center;justify-content:center;color:var(--pd-c); }

/* ── METRIC MINI ── */
.mm {
  background: var(--g1);
  border-radius: var(--rmd);
  padding: var(--s3) var(--s4);
  border: 1px solid var(--g3);
}
.card > .mm { background: transparent; border: 0; padding: 0; }
.mm .ml { font-size: var(--txs); color: var(--g5); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; font-weight: 700; }
.mm .mv { font-size: 22px; font-weight: 900; color: var(--g9); }
.mm .ms { font-size: var(--txs); color: var(--g5); margin-top: 2px; }

/* ── PROGRESS ── */
.prog-wrap { margin-top: var(--s1); }
.prog-row  { display: flex; align-items: center; gap: var(--s2); margin-bottom: 8px; font-size: var(--tsm); }
.prog-name { color: var(--g7); min-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog-track{ flex: 1; background: var(--g3); border-radius: var(--rfull); height: 6px; overflow: hidden; }
.prog-bar  { height: 100%; border-radius: var(--rfull); transition: width .5s; }
.prog-bar.verde   { background: var(--cok); }
.prog-bar.amarillo{ background: var(--cw); }
.prog-bar.rojo    { background: var(--cd); }
.prog-val  { min-width: 36px; text-align: right; font-weight: 700; color: var(--g9); }

/* ── TABLE ── */
.tbl { width: 100%; border-collapse: collapse; font-size: var(--tsm); }
.tbl th {
  background: var(--cp); color: #fff;
  padding: 9px 11px;
  text-align: left; font-weight: 700;
  font-size: var(--txs); letter-spacing: .4px;
  text-transform: uppercase;
}
.tbl th:first-child { border-radius: var(--rmd) 0 0 0; }
.tbl th:last-child  { border-radius: 0 var(--rmd) 0 0; }
.tbl td { padding: 9px 11px; border-bottom: 1px solid var(--g3); vertical-align: middle; }
.tbl tr:hover td { background: var(--g1); }
.tbl .num { text-align: center; font-weight: 700; }

.rank-n {
  width: 24px; height: 24px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: var(--txs); font-weight: 900;
  background: var(--cp); color: #fff;
}
.rank-n.r1 { background: var(--ca); color: var(--cpd); }
.rank-n.r2 { background: var(--g5); color: #fff; }
.rank-n.r3 { background: #CD7F32; color: #fff; }

/* ── COMPROMISOS ── */
.comp-item { display: flex; align-items: center; gap: var(--s2); padding: 8px 0; border-bottom: 1px solid var(--g3); font-size: var(--tsm); }
.comp-item:last-child { border-bottom: none; }
.comp-desc { flex: 1; color: var(--g7); }
.comp-pct  { font-weight: 900; min-width: 38px; text-align: right; }
.comp-pct.verde   { color: var(--cok); }
.comp-pct.amarillo{ color: #9C6800; }
.comp-pct.rojo    { color: var(--cd); }

/* ── COORD TAG ── */
.coord-tag {
  display: inline-flex; align-items: center; gap: var(--s1);
  background: var(--cpl); border: 1px solid var(--g3);
  border-radius: var(--rmd); padding: 4px var(--s2);
  font-size: var(--tsm); color: var(--cp);
  margin: 3px; font-weight: 600;
}

/* ── CHIPS (MODAL SECTOR) ── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--rmd);
  border: 1px solid var(--g3);
  background: var(--wh);
  font-family: var(--font);
  font-size: var(--tsm);
  color: var(--g7);
  cursor: pointer;
  transition: all .15s;
  text-align: left;
}
.chip:hover { border-color: var(--cp); }
.chip.active { border-color: var(--cp); background: var(--cpl); }
.chip .chip-sec {
  flex-shrink: 0;
  background: var(--cp);
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  padding: 2px 9px;
  border-radius: var(--rmd);
}
.chip .chip-nombre { font-size: 12px; color: var(--g7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.active .chip-nombre { color: var(--cp); }
.chip-all { justify-content: center; font-weight: 600; color: var(--cp); }
.chip-all.active { background: var(--cp); color: #fff; }
.chip-all.active .chip-nombre { color: #fff; }

/* ── MODAL SECTOR ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100;
  display: none; align-items: center; justify-content: center;
}
.modal-card {
  background: var(--wh); width: 600px; max-width: 90vw;
  border-radius: var(--rlg); padding: var(--s5);
  max-height: 80vh; overflow-y: auto;
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: var(--s4);
}
.modal-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--s2);
}
.tb-selector {
  background: var(--wh) !important;
  color: var(--g7) !important;
  border: 1px solid var(--g3) !important;
}
.tb-selector:hover { border-color: var(--cp) !important; color: var(--cp) !important; }

/* ── SEL INFO BANNER ── */
.info-row {
  margin-bottom: var(--s4);
}
.jefe-card {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  background: var(--wh);
  border: 1px solid var(--g3);
  border-radius: var(--rlg);
  padding: var(--s3);
  box-shadow: var(--shsm);
}
.info-row .sel-info { margin-bottom: 0; }
.sel-info {
  background: linear-gradient(135deg, var(--cp) 0%, var(--cpd) 100%);
  border-radius: var(--rlg);
  padding: var(--s4) var(--s5);
  margin-bottom: var(--s4);
  display: flex; align-items: center; gap: var(--s4);
  box-shadow: var(--shmd);
}
.sel-avatar {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--cs);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px;
  color: var(--cpd); flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,201,167,.4);
}
.sel-badge {
  display: inline-block;
  background: rgba(255,255,255,.18);
  color: #fff;
  font-size: var(--txs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  padding: 2px 9px;
  border-radius: var(--rfull);
  margin-bottom: 5px;
}
.sel-badge-sup { background: #fff; color: var(--csd); }
.sel-data h3  { color: #fff; font-size: var(--tbase); font-weight: 700; }
.sel-score { margin-left: auto; text-align: right; }
.sel-score .score-n { font-size: 30px; font-weight: 900; color: var(--cs); line-height: 1; }
.sel-score .score-l { font-size: var(--txs); color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .5px; }
.sel-sector {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.28);
  border-radius: var(--rmd);
  padding: var(--s2) var(--s4);
  text-align: center;
}
.sel-sector .sel-sector-label {
  font-size: var(--txs);
  color: rgba(255,255,255,.65);
  text-transform: uppercase;
  letter-spacing: .5px;
  font-weight: 700;
}
.sel-sector .sel-sector-num {
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
}

/* ── CARDS SUPERVISOR ── */
.sup-card-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); width: 100%; }
.sup-card {
  display: flex; flex-direction: column; gap: 3px;
  align-items: flex-start;
  padding: var(--s3) var(--s3);
  border-radius: var(--rmd);
  border: 1px solid var(--g3);
  background: var(--wh);
  font-family: var(--font);
  cursor: pointer;
  transition: all .15s;
  text-align: left;
}
.sup-card:hover { border-color: var(--cs); box-shadow: var(--shsm); }
.sup-card.active { border-color: var(--csd); background: var(--csl); box-shadow: var(--shsm); }
.sup-badge {
  display: inline-block;
  background: var(--csl);
  color: var(--csd);
  font-size: var(--txs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: 1px 9px;
  border-radius: var(--rfull);
}
.sup-card-name { font-size: var(--tsm); color: var(--g7); font-weight: 700; line-height: 1.2; }
.sup-card-meta { font-size: var(--txs); color: var(--g5); font-weight: 600; }
.sup-card-sec {
  align-self: flex-start;
  background: var(--cp);
  color: #fff;
  font-size: var(--txs);
  font-weight: 700;
  letter-spacing: .3px;
  padding: 1px 9px;
  border-radius: var(--rfull);
  margin-top: 2px;
}
.sup-card.active .sup-card-name { color: var(--cp); }
.sup-card.active .sup-card-meta { color: var(--cpd); }
