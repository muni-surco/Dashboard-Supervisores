function letterFromName(n){ var m=n.match(/\((\w)\)/); return m?m[1].toUpperCase():null; }

function kpiVal(d,k){ return k.val?k.val(d):d[k.key]; }

function computeThresholds(){
  KPI_DEFS.forEach(function(k){
    var values = SECTORES.map(function(s){ return kpiVal(s,k); }).sort(function(a,b){ return a-b; });
    var n = values.length;
    if(n<3){ k._lo=values[0]; k._hi=values[n-1]; return; }
    k._lo = values[Math.floor(n/3)];
    k._hi = values[Math.ceil(2*n/3)-1];
    if(k.key==='incDelictivas'){
      k.thr = function(d){
        var v = kpiVal(d,k);
        if(v <= k._lo) return 'verde';
        if(v <= k._hi) return 'amarillo';
        return 'rojo';
      };
    } else {
      k.thr = function(d){
        var v = kpiVal(d,k);
        if(v >= k._hi) return 'verde';
        if(v >= k._lo) return 'amarillo';
        return 'rojo';
      };
    }
  });
}

function getSectorData(){
  const v=CURRENT_SECTOR_ID;
  return v==='0'?null:(SECTORES.find(s=>s.id===v)||null);
}
function getSupData(sector){
  const v=document.getElementById('selSup').value;
  if(v==='0'||!sector)return null;
  return {sup:sector.supervisores.find(p=>baseName(p.n)===v),rend:sector.rendimiento.find(r=>baseName(r.sup)===v)};
}

function populateSupervisores(){
  const sel=document.getElementById('selSup');
  const sv=sel.value;
  const sid=CURRENT_SECTOR_ID;
  var raw=SECTORES.flatMap(x=>x.supervisores);
  var seen={};
  var lista=raw.filter(function(p){
    var b=baseName(p.n);
    if(seen[b])return false;
    seen[b]=true;
    return true;
  });
  const opts = '<option value="0">Todos los Supervisores</option>' +
    lista.map(function(p) {
      const name = baseName(p.n).replace(/"/g,'&quot;');
      return '<option value="' + name + '">' + baseName(p.n) + '</option>';
    }).join('');
  sel.innerHTML=opts;
  const selSec=SECTORES.find(function(x){ return x.id===sid; });
  const jefes=selSec?sectoresDeJefe(selSec):[];
  var compatible = sv==='0' || sid==='0' ||
    jefes.some(function(sec){ return (sec.supervisores||[]).some(function(p){ return baseName(p.n)===sv; }); });
  if(compatible&&[...sel.options].some(o=>o.value===sv))sel.value=sv;else sel.value='0';
}
function statusLabel(s){
  if(s==='verde')return['verde','Cumplido'];
  if(s==='amarillo')return['amarillo','Parcial'];
  return['rojo','No cumplido'];
}

function baseName(n){ var m=n.match(/^(.*?)\s*\((\w)\)/); return m?m[1]:n; }

function formatNum(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toLocaleString('en-US');
}

function onJefeChange(){
  TURNO_FILTER=null;

}

function onSupChange(){
  const sv=document.getElementById('selSup').value;
  if(sv==='0'){ CURRENT_SECTOR_ID='0'; TURNO_FILTER=null; loadData(); return; }
  const sec=SECTORES.find(function(x){
    return (x.supervisores||[]).some(function(p){ return baseName(p.n)===sv; });
  });
  if(sec)CURRENT_SECTOR_ID=sec.id;
  applySupSelection();
}

function applySupSelection(){
  const sv=document.getElementById('selSup').value;
  TURNO_FILTER=null;
  if(sv&&sv!=='0'){
    const sec=SECTORES.find(function(x){ return x.id===CURRENT_SECTOR_ID; });
    const letters={};
    (sec?sectoresDeJefe(sec):[]).forEach(function(x){
      (x.supervisores||[]).forEach(function(p){
        if(baseName(p.n)===sv){
          const lt=letterFromName(p.n);
          if(lt)letters[lt]=true;
        }
      });
    });
    const keys=Object.keys(letters);
    if(keys.length===1)TURNO_FILTER=LETTER_MAP[keys[0]]||null;
  }
  loadData();
}

function renderSupCards(s){

      const turno=p.n.includes('(M)')?'Mañana':p.n.includes('(T)')?'Tarde':p.n.includes('(N)')?'Noche':'—';

function renderKPIs(s){
  const row=document.getElementById('kpi-row');
  const aggK=(k)=>{
    const vals=SECTORES.map(x=>kpiVal(x,k));
    if(typeof vals[0]!=='number')return vals.reduce((a,b)=>a+b,0);
    if(k.unit==='%')return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    return vals.reduce((a,b)=>a+b,0);
  };
  const avgSt=(k)=>{
    if(s)return k.thr(s);
    const v=SECTORES.map(x=>k.thr(x));
    return v.some(x=>x==='rojo')?'rojo':v.some(x=>x==='amarillo')?'amarillo':'verde';
  };
  var curSup = document.getElementById('selSup') ? document.getElementById('selSup').value : '0';
  var supRow = null;
  if(curSup && curSup !== '0' && s){
    var sRows = supervisorRows();
    supRow = sRows.find(function(r){ return r.sup === curSup && r.sec === s.id; });
    if(!supRow) supRow = sRows.find(function(r){ return r.sup === curSup; });
  }
  row.innerHTML = KPI_DEFS.map(function(k){
    const total = aggK(k);
    var v = s ? kpiVal(s,k) : total;
    if(k.key === 'incDelictivas' && supRow){
      v = supRow.inc;
    }
    const st = avgSt(k);
    const pct = total ? Math.round(v/total*100) : 0;
    const strCls = st==='verde'?'up':st==='amarillo'?'warn':'dn';
    return '<div class="sc2">' +
      '<div class="si ' + k.si + '" style="color:' + k.icolor + '">' + iconoSvg(k.icon,22) + '</div>' +
      '<div style="min-width:0;">' +
        '<div class="sv">' + formatNum(v) + k.unit + '</div>' +
        '<div class="sl">' + k.label + '</div>' +
        '<div class="str ' + strCls + '">' + pct + '% del total</div>' +
      '</div>' +
    '</div>';
  }).join('');
  row.style.gridTemplateColumns='repeat(5,1fr)';
}

  SUBCLAS_ENTRIES=Object.keys(subData).map(k=>[k,subData[k]])

  var curSup = document.getElementById('selSup') ? document.getElementById('selSup').value : '0';

  if(curSup && curSup !== '0' && s){

  const instTurno=getChart('turnoDelitos',document.getElementById('chartTurnoDelitos'));

function hashColor(key,palette){
  var h=0;
  for(var i=0;i<String(key).length;i++){ h=(h*31+String(key).charCodeAt(i))>>>0; }
  return palette[h%palette.length];
}

function tipoIcono(t){
  const s=String(t||'').toUpperCase();
  if(s.indexOf('PERSONA')!==-1)return 'user';
  if(s.indexOf('VEHIC')!==-1||s.indexOf('AUTOPART')!==-1)return 'car';
  if(s.indexOf('EQUIPO')!==-1)return 'smartphone';
  if(s.indexOf('ESTABLECIMIENTO')!==-1||s.indexOf('COMERCIO')!==-1||s.indexOf('LOCAL')!==-1)return 'store';
  if(s.indexOf('ESTAFA')!==-1)return 'badge-dollar';
  return 'siren';
}

const ICONO_SVG = {};
function iconoSvg(name,size){
  if(ICONO_SVG[name])return ICONO_SVG[name];
  const tmp=document.createElement('div');
  tmp.style.cssText='position:absolute;left:-9999px;width:0;height:0;overflow:hidden;';
  tmp.innerHTML='<i data-lucide="'+name+'" style="width:'+size+'px;height:'+size+'px"></i>';
  document.body.appendChild(tmp);
  lucide.createIcons();
  const svg=tmp.querySelector('svg');
  if(svg){ svg.setAttribute('width',size); svg.setAttribute('height',size); }
  ICONO_SVG[name]=tmp.innerHTML;
  document.body.removeChild(tmp);
  return ICONO_SVG[name];
}

function applySubclas(){
  const inst=getChart('subclas',document.getElementById('chartSubclas'));
  const entries=SUBCLAS_ENTRIES;
  const selIdx=TIPO_SELECCIONADO?entries.findIndex(e=>e[0]===TIPO_SELECCIONADO):-1;
  inst.off('click');
  inst.clear();
  inst.setOption({
    textStyle:{fontFamily:ECH_FONT,color:DS.g7},
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:function(v){return formatNum(v);}},
    grid:{left:8,right:20,top:8,bottom:8,containLabel:true},
    xAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(0,0,0,.05)'}},axisLabel:{fontSize:11}},
    yAxis:{type:'category',inverse:true,
      data:entries.map(function(e,i){return (i+1)+'. '+e[0];}),
      axisTick:{show:false},axisLine:{show:false},
      axisLabel:{fontSize:11}},
    series:[{type:'bar',barMaxWidth:18,
      label:{show:true,position:'right',formatter:function(p){return formatNum(p.value);},fontSize:11,color:DS.g7},
      itemStyle:{borderRadius:[0,6,6,0]},
      data:entries.map(function(e,i){return {value:e[1],itemStyle:{color:i===selIdx?DS.accent:DS.primary}};})}]
  });
  inst.on('click',onSubclasClick);
}

function onSubclasClick(params){
  if(!params||params.dataIndex===undefined)return;
  const idx=params.dataIndex;
  const tipo=SUBCLAS_ENTRIES[idx][0];
  TIPO_SELECCIONADO = (TIPO_SELECCIONADO===tipo)?null:tipo;
  applySubclas();
  renderMap(getSectorData());
}

function renderMap(s){
  const el=document.getElementById('mapa-ubicaciones');
  if(!el)return;
  if(!window.L){ el.innerHTML='<div class="ml" style="padding:12px;">Cargando mapa…</div>'; return; }
  const pts=MAPA_PUNTOS.filter(p=>(!s||p.sector===s.id)&&(!TIPO_SELECCIONADO||grupoSubclas(p.tipo)===TIPO_SELECCIONADO));
  if(!mapInstance){
    mapInstance=L.map(el,{scrollWheelZoom:false}).setView([-12.1389,-77.0227],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(mapInstance);
    markerLayer=L.layerGroup().addTo(mapInstance);
  }
  markerLayer.clearLayers();
  if(!pts.length){
    mapInstance.setView([-12.1389,-77.0227],13);
    return;
  }
  const colorMap={};
  pts.forEach(function(p){ if(!colorMap[p.tipo])colorMap[p.tipo]=hashColor(p.tipo,SECTOR_COLORS); });
  pts.forEach(function(p){

function sectoresSorted(){ return SECTORES.slice().sort(function(a,b){ return String(a.id).localeCompare(String(b.id)); }); }

function respStatus(v){
  if(!(v>0))return 'rojo';
  var vals=SECTORES.map(function(s){ return s.tasaResp; }).filter(function(x){ return x>0; }).sort(function(a,b){ return a-b; });
  if(!vals.length)return 'rojo';
  var lo=vals[Math.floor(vals.length/3)];
  var hi=vals[Math.floor(2*vals.length/3)];
  if(v<=lo)return 'verde';
  if(v<=hi)return 'amarillo';
  return 'rojo';
}
function respStatusColor(v){
  var st=respStatus(v);
  return st==='verde'?DS.success:st==='amarillo'?DS.warning:DS.danger;
}

function grupoSubclas(k){ var p=String(k||'').split(' - ')[0]; return p||String(k); }
function valSubclas(s,g){ var v=0; Object.keys(s.subclas||{}).forEach(function(k){ if(grupoSubclas(k)===g)v+=s.subclas[k]; }); return v; }
function sectorTopDelito(s){
  var agg={};
  Object.keys(s.subclas||{}).forEach(function(k){ var g=grupoSubclas(k); agg[g]=(agg[g]||0)+s.subclas[k]; });
  var keys=Object.keys(agg);
  if(!keys.length)return null;
  var best=keys[0],max=agg[best];
  keys.forEach(function(k){ if(agg[k]>max){ max=agg[k]; best=k; } });
  return {name:best,val:max};
}
function topSubclasGlobal(n){
  var agg={};
  SECTORES.forEach(function(s){
    Object.keys(s.subclas||{}).forEach(function(k){ var g=grupoSubclas(k); agg[g]=(agg[g]||0)+s.subclas[k]; });
  });
  return Object.keys(agg).map(function(k){ return [k,agg[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,n);
}
function kpiStatus(k,sec){
  try{ return k.thr(sec); }catch(e){ return 'rojo'; }
}

function turnosSupervisor(secId, name){
  var total=0;
  (CACHED_TURNOS||[]).forEach(function(t){
    if(t.sector===secId&&t.supervisor===name)total+=t.partes;
  });
  return total;
}
function supervisorRows(){
  var map={};
  SECTORES.forEach(function(s){
    (s.rendimiento||[]).forEach(function(r){
      var astEntry=(s.supervisores||[]).find(function(p){ return baseName(p.n)===baseName(r.sup); });
      var nm=baseName(r.sup);
      var key=s.id+'|'+nm;
      var partes=turnosSupervisor(s.id,nm);
      if(!map[key])map[key]={sup:nm,sec:s.id,turnos:[],turno:'—',inc:0,delitos:0,partes:partes,ratio:0,ast:astEntry?astEntry.ast:null,
        rutas:r.rutas,reportes:r.reportes,actitud:r.actitud,total:r.total};
      var lt=letterFromName(r.sup);
      if(lt&&map[key].turnos.indexOf(lt)===-1){map[key].turnos.push(lt);map[key].inc+=franjaInc(s,lt);map[key].delitos+=franjaDelitos(s,lt);}
      if(partes>map[key].partes)map[key].partes=partes;
    });
  });
  var rows=[];
  Object.keys(map).forEach(function(k){ var r=map[k]; r.turno=r.turnos.map(turnoLabel).join('/')||'—'; r.ratio=r.partes>0?Math.round(r.inc/r.partes):0; rows.push(r); });
  rows.sort(function(a,b){ return (b.inc-a.inc) || String(a.sec).localeCompare(String(b.sec)) || String(a.sup).localeCompare(String(b.sup)); });
  return rows;
}
function turnoLabel(t){ return t==='M'?'Mañana':t==='T'?'Tarde':t==='N'?'Noche':'—'; }
function shortName(nm){
  const parts=String(nm||'').trim().split(/\s+/);
  if(parts.length<=2)return parts.join(' ');
  return parts.slice(0,2).join(' ');
}
function franjaInc(s, turno){
  if(!s||!s.franjas||!s.franjas.length||!turno)return 0;
  var L=turno==='M'?'Mañana':turno==='T'?'Tarde':turno==='N'?'Noche':null;
  var f=L?s.franjas.find(function(x){ return x.l===L; }):null;
  if(f)return f.v;
  var R=turno==='M'?'06–12h':turno==='T'?'12–18h':turno==='N'?'18–24h':null;
  f=R?s.franjas.find(function(x){ return x.l===R; }):null;
  return f?f.v:0;
}
function franjaDelitos(s, turno){
  if(!s||!s.franjasDelitos||!s.franjasDelitos.length||!turno)return 0;
  var L=turno==='M'?'Mañana':turno==='T'?'Tarde':turno==='N'?'Noche':null;
  var f=L?s.franjasDelitos.find(function(x){ return x.l===L; }):null;
  if(f)return f.v;
  var R=turno==='M'?'06–12h':turno==='T'?'12–18h':turno==='N'?'18–24h':null;
  f=R?s.franjasDelitos.find(function(x){ return x.l===R; }):null;
  return f?f.v:0;
}
function franjaDelitoTipo(s, turno, grupo){
  if(!s||!s.subclasFranjas||!turno)return 0;
  var L=turno==='M'?'Mañana':turno==='T'?'Tarde':turno==='N'?'Noche':null;
  var map=L?s.subclasFranjas[L]:null;
  if(!map)return 0;
  var v=0;
  Object.keys(map).forEach(function(k){ if(grupoSubclas(k)===grupo)v+=map[k]; });
  return v;
}
function supDelitoTipo(r, grupo){
  var v=0;
  (r.turnos||[]).forEach(function(lt){ v+=franjaDelitoTipo(SECTORES.find(function(x){ return x.id===r.sec; }), lt, grupo); });
  return v;
}
function rendCls(v){ return v>=90?'verde':v>=75?'amarillo':'rojo'; }
function astCls(v){ return v>=95?'verde':v>=85?'amarillo':'rojo'; }

  document.getElementById('panel-'+id).classList.add('active');
  el.classList.add('active');
  var esComp = id==='comparativa';
  document.getElementById('btn-sector-selector').classList.toggle('hidden', esComp);
  document.getElementById('selSup').classList.toggle('hidden', esComp);
  if(id==='dashboard'&&mapInstance)mapInstance.invalidateSize();
  if(id==='comparativa')renderComparativa();
  setTimeout(resizeCharts,50);
}

function buildSupervisores(sectores, supRows){
  var supData={};
  supRows.forEach(function(r){
    if(!supData[r.sector])supData[r.sector]=[];
    supData[r.sector].push(r);
  });
  sectores.forEach(function(sec){
    var rows=supData[sec.id]||[];
    if(rows.length===0)return;
    var turnoMap={};
    rows.forEach(function(r){
      var t=(r.turno||'').toUpperCase();
      var key=t.indexOf("M")!==-1?"M":t.indexOf("T")!==-1?"T":t.indexOf("N")!==-1?"N":"X";
      if(!turnoMap[key])turnoMap[key]={names:{},count:0};
      turnoMap[key].names[r.supervisor]=(turnoMap[key].names[r.supervisor]||0)+r.partes;
      turnoMap[key].count++;
    });
    var newSups=[];
    ["M","T","N"].forEach(function(tk){
      var td=turnoMap[tk];
      if(!td||Object.keys(td.names).length===0)return;
      var bestName="",bestPartes=0;
      Object.keys(td.names).forEach(function(nm){if(td.names[nm]>bestPartes){bestPartes=td.names[nm];bestName=nm;}});
      if(!bestName)return;
      var partesAvg=Math.round((bestPartes/td.count)*22);
      var ast=Math.min(100,Math.max(60,partesAvg));
      newSups.push({n:bestName+" ("+tk+")",ast:ast});
    });
    if(newSups.length>0){
      sec.supervisores=newSups;
      sec.rendimiento=newSups.map(function(p){return{
        sup:p.n,rutas:Math.min(100,Math.max(60,Math.round(p.ast*0.95))),
        reportes:Math.min(100,Math.max(60,Math.round(p.ast*0.90))),
        actitud:Math.min(100,Math.max(60,Math.round(p.ast*0.85))),
        total:Math.round((p.ast*0.95+p.ast*0.90+p.ast*0.85)/3)
      };});
    }
  });
}

function finishLoad(sectoresData, supRows, fStart, fEnd, ubicaciones){
  SECTORES=sectoresData.map(s => ({
    id: s.id,
    nombre: s.nombre,
    sector: s.sector_display,
    initials: s.initials,
    incTotal: s.incTotal,
    tasaResp: Math.round(parseFloat(s.tasaResp)*10)/10,
    comisarias: s.comisarias || [],
    franjas: s.franjas,
    franjasDelitos: s.franjasDelitos || [],
    subclasFranjas: s.subclasFranjas || {},
    tiposDelito: s.tiposDelito || {},
    subclas: s.subclas || {},
    frustrados: s.robosFrustrados,
    robosFrustrados: s.robosFrustrados,
    operativosCount: s.operativosCount,
    coordVecinales: s.coordVecinales,
    capturas: s.capturas,
    patrullajeCount: s.patrullajeCount,
    supervisores: [], // Will be filled by buildSupervisores
    rendimiento: []   // Will be filled by buildSupervisores
  }));

  buildSupervisores(SECTORES,supRows||[]);
  computeThresholds();
  MAPA_PUNTOS = ubicaciones || [];
  document.getElementById('loading-overlay').style.display='none';
  updateDash();
  lucide.createIcons();
  setTimeout(resizeCharts,60);
  setTimeout(resizeCharts,250);
}

function callRpc(promiseFactory){
  var attempts=3, delayMs=600, timeoutMs=30000;
  return new Promise(function(resolve){
    var attempt=function(n){
      var controller=('AbortController' in window)?new AbortController():null;
      var timer=controller?setTimeout(function(){controller.abort();},timeoutMs):null;
      var p;
      try{ p=promiseFactory(controller); }catch(e){ p=Promise.resolve({data:null,error:e}); }
      Promise.resolve(p).then(function(res){
        if(timer)clearTimeout(timer);
        if(res&&res.error){
          if(n<attempts){ setTimeout(function(){attempt(n+1);},delayMs*n); }
          else resolve(res);
        }else{
          resolve(res);
        }
      }).catch(function(err){
        if(timer)clearTimeout(timer);
        if(n<attempts){ setTimeout(function(){attempt(n+1);},delayMs*n); }
        else resolve({data:null,error:err});
      });
    };
    attempt(1);
  });
}

function showToast(msg){
  var t=document.getElementById('dash-toast');
  if(!t){
    t=document.createElement('div');
    t.id='dash-toast';
    t.style.cssText='position:fixed;bottom:16px;right:16px;z-index:99999;background:#E03E3E;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;font-family:\'Chivo\',sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.25);max-width:340px;display:none;';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.display='block';
  clearTimeout(showToast._t);
  showToast._t=setTimeout(function(){ t.style.display='none'; }, 6000);
}

function loadData(){
  document.getElementById('loading-overlay').style.display='flex';

  var fStart = document.getElementById('fechaInicio').value;
  var fEnd = document.getElementById('fechaFin').value;

  var pDashboardData = callRpc(function(ctrl){
    return supabaseClient.rpc('get_dashboard_sectors', {
      p_fecha_inicio: fStart || null,
      p_fecha_fin: fEnd || null,
      p_turno_filter: TURNO_FILTER
    }, ctrl?{signal:ctrl.signal}:undefined);
  }).then(function(res){
    if(res.error)throw new Error('Error Supabase RPC: '+res.error.message);
    return res.data;
  });

  var pUbicaciones = callRpc(function(ctrl){
    return supabaseClient.rpc('get_delitos_ubicaciones', {
      p_fecha_inicio: fStart || null,
      p_fecha_fin: fEnd || null,
      p_turno_filter: TURNO_FILTER
    }, ctrl?{signal:ctrl.signal}:undefined);
  }).then(function(res){
    return res.error ? [] : (res.data || []);
  });

  var pTurnos = new Promise(function(resolve){
    google.script.run
      .withSuccessHandler(function(d){ resolve(d&&d.error?[]:(d||[])); })
      .withFailureHandler(function(){ resolve([]); })
      .getSupervisoresDetalle();
  });

  Promise.all([pDashboardData, pUbicaciones, pTurnos]).then(function(results){
    var sectoresData=results[0];
    var ubicaciones=results[1];
    CACHED_TURNOS=results[2]||[];

    google.script.run
      .withSuccessHandler(function(supData){
        if(supData&&!supData.error){
          CACHED_SUPERVISORS=supData.supervisores||[];
        }else{
          console.warn('Supervisores:',supData?.error||'sin datos');
          CACHED_SUPERVISORS=[];
        }
        finishLoad(sectoresData,CACHED_SUPERVISORS,fStart,fEnd,ubicaciones);
      })
      .withFailureHandler(function(err){
        console.warn('Error GAS supervisores:',err);
        CACHED_SUPERVISORS=[];
        finishLoad(sectoresData,[],fStart,fEnd,ubicaciones);
      })
      .getSupervisoresData(fStart,fEnd);

  }).catch(function(err){
    showToast(err.message||'Error al cargar datos');
    document.getElementById('loading-overlay').style.display='none';
  });
}

function onFechaChange(){
  loadData();
}

function clearFilters(){
  CURRENT_SECTOR_ID='0';
  document.getElementById('selSup').value='0';
  TURNO_FILTER=null;
  setDefaultDates();
  loadData();
}

function setDefaultDates(){
  var today=new Date();
  var fmtD=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  document.getElementById('fechaInicio').value='2026-01-01';
  document.getElementById('fechaFin').value=fmtD(today);
}

window.addEventListener('load',function(){
  setDefaultDates();
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  loadData();
});
</script>
