function letterFromName(n){ var m=n.match(/\((\w)\)/); return m?m[1].toUpperCase():null; }

function kpiVal(d,k){ return k.val?k.val(d):d[k.key]; }

function computeThresholds(){
  KPI_DEFS.forEach(function(k){
    var values = SECTORES.map(function(s){ return kpiVal(s,k); }).sort(function(a,b){ return a-b; });
    var n = values.length;
    if(n<3){ k._lo=values[0]; k._hi=values[n-1]; return; }
    k._lo = values[Math.floor(n/3)];
    k._hi = values[Math.ceil(2*n/3)-1];
    if(k.key==='incDelictivas'){
      k.thr = function(d){
        var v = kpiVal(d,k);
        if(v <= k._lo) return 'verde';
        if(v <= k._hi) return 'amarillo';
        return 'rojo';
      };
    } else {
      k.thr = function(d){
        var v = kpiVal(d,k);
        if(v >= k._hi) return 'verde';
        if(v >= k._lo) return 'amarillo';
        return 'rojo';
      };
    }
  });
}

const charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].dispose(); delete charts[id]; } }
function getChart(id, el){ if(!charts[id]) charts[id]=echarts.init(el); return charts[id]; }
function resizeCharts(){ Object.keys(charts).forEach(function(k){ if(charts[k]) charts[k].resize(); }); }

function getSectorData(){
  const v=CURRENT_SECTOR_ID;
  return v==='0'?null:(SECTORES.find(s=>s.id===v)||null);
}
function getSupData(sector){
  const v=document.getElementById('selSup').value;
  if(v==='0'||!sector)return null;
  return {sup:sector.supervisores.find(p=>baseName(p.n)===v),rend:sector.rendimiento.find(r=>baseName(r.sup)===v)};
}

function renderSectorModal(){
  const row=document.getElementById('modal-sector-grid');
  if(!row)return;
  const cur=CURRENT_SECTOR_ID;
  const byId=function(id){ return SECTORES.find(x=>x.id===id); };
  let html='<button type="button" class="chip chip-all' + (cur==='0'?' active':'') + '" onclick="selectSector(\'0\')">Todos los Sectores</button>';
  html += SECTORES.map(function(s){
    const act=s.id===cur?' active':'';
    return '<button type="button" class="chip' + act + '" onclick="selectSector(\'' + s.id + '\')">' +
      '<span class="chip-sec">' + s.id + '</span>' +
      '<span class="chip-nombre">' + s.nombre + '</span></button>';
  }).join('');
  row.innerHTML=html;
  const sel=byId(cur);
  document.getElementById('label-sector').textContent = cur==='0' ? 'Todos los Sectores' : (sel?sel.id:'Todos los Sectores');
}
function openSectorModal(){ document.getElementById('modal-sector').style.display='flex'; }
function closeSectorModal(){ document.getElementById('modal-sector').style.display='none'; }
function selectSector(id){
  CURRENT_SECTOR_ID=id;
  closeSectorModal();

}

function populateSupervisores(){
  const sel=document.getElementById('selSup');
  const sv=sel.value;
  const sid=CURRENT_SECTOR_ID;
  var raw=SECTORES.flatMap(x=>x.supervisores);
  var seen={};
  var lista=raw.filter(function(p){
    var b=baseName(p.n);
    if(seen[b])return false;
    seen[b]=true;
    return true;
  });
  const opts = '<option value="0">Todos los Supervisores</option>' +
    lista.map(function(p) {
      const name = baseName(p.n).replace(/"/g,'&quot;');
      return '<option value="' + name + '">' + baseName(p.n) + '</option>';
    }).join('');
  sel.innerHTML=opts;
  var compatible = sv==='0' || sid==='0' ||
    (SECTORES.find(x=>x.id===sid)?.supervisores||[]).some(p=>baseName(p.n)===sv);
  if(compatible&&[...sel.options].some(o=>o.value===sv))sel.value=sv;else sel.value='0';
}
function statusLabel(s){
  if(s==='verde')return['verde','Cumplido'];
  if(s==='amarillo')return['amarillo','Parcial'];
  return['rojo','No cumplido'];
}

function baseName(n){ var m=n.match(/^(.*?)\s*\((\w)\)/); return m?m[1]:n; }

function formatNum(n){
  if(n===null||n===undefined||isNaN(n))return '—';
  return Number(n).toLocaleString('en-US');
}

function onJefeChange(){
  TURNO_FILTER=null;

}

function onSupChange(){
  var sv=document.getElementById('selSup').value;
  TURNO_FILTER=null;
  if(sv&&sv!=='0'){
    SECTORES.forEach(function(sec){
      sec.supervisores.forEach(function(p){
        if(baseName(p.n)===sv){
          CURRENT_SECTOR_ID=sec.id;
          var lt=letterFromName(p.n);
          if(lt)TURNO_FILTER=LETTER_MAP[lt]||null;
        }
      });
    });
  }
  loadData();
}

function renderKPIs(s){
  const row=document.getElementById('kpi-row');
  const aggK=(k)=>{
    const vals=SECTORES.map(x=>kpiVal(x,k));
    if(typeof vals[0]!=='number')return vals.reduce((a,b)=>a+b,0);
    if(k.unit==='%')return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    return vals.reduce((a,b)=>a+b,0);
  };
  const avgSt=(k)=>{
    if(s)return k.thr(s);
    const v=SECTORES.map(x=>k.thr(x));
    return v.some(x=>x==='rojo')?'rojo':v.some(x=>x==='amarillo')?'amarillo':'verde';
  };
  row.innerHTML = KPI_DEFS.map(function(k){
    const total = aggK(k);
    const v = s ? kpiVal(s,k) : total;
    const st = avgSt(k);
    const pct = total ? Math.round(v/total*100) : 0;
    const strCls = st==='verde'?'up':st==='amarillo'?'warn':'dn';
    return '<div class="sc2">' +
      '<div class="si ' + k.si + '" style="color:' + k.icolor + '">' + iconoSvg(k.icon,22) + '</div>' +
      '<div style="min-width:0;">' +
        '<div class="sv">' + formatNum(v) + k.unit + '</div>' +
        '<div class="sl">' + k.label + '</div>' +
        '<div class="str ' + strCls + '">' + pct + '% del total</div>' +
      '</div>' +
    '</div>';
  }).join('');
  row.style.gridTemplateColumns='repeat(5,1fr)';
}

  const patr=s?d.patrullajeCount:Math.round(SECTORES.reduce((a,x)=>a+(x.patrullajeCount||0),0));

function hashColor(key,palette){
  var h=0;
  for(var i=0;i<String(key).length;i++){ h=(h*31+String(key).charCodeAt(i))>>>0; }
  return palette[h%palette.length];
}

function tipoIcono(t){
  const s=String(t||'').toUpperCase();
  if(s.indexOf('PERSONA')!==-1)return 'user';
  if(s.indexOf('VEHIC')!==-1||s.indexOf('AUTOPART')!==-1)return 'car';
  if(s.indexOf('EQUIPO')!==-1)return 'smartphone';
  if(s.indexOf('ESTABLECIMIENTO')!==-1||s.indexOf('COMERCIO')!==-1||s.indexOf('LOCAL')!==-1)return 'store';
  if(s.indexOf('ESTAFA')!==-1)return 'badge-dollar';
  return 'siren';
}

const ICONO_SVG = {};
function iconoSvg(name,size){
  if(ICONO_SVG[name])return ICONO_SVG[name];
  const tmp=document.createElement('div');
  tmp.style.cssText='position:absolute;left:-9999px;width:0;height:0;overflow:hidden;';
  tmp.innerHTML='<i data-lucide="'+name+'" style="width:'+size+'px;height:'+size+'px"></i>';
  document.body.appendChild(tmp);
  lucide.createIcons();
  const svg=tmp.querySelector('svg');
  if(svg){ svg.setAttribute('width',size); svg.setAttribute('height',size); }
  ICONO_SVG[name]=tmp.innerHTML;
  document.body.removeChild(tmp);
  return ICONO_SVG[name];
}

function applySubclas(){
  const inst=getChart('subclas',document.getElementById('chartSubclas'));
  const entries=SUBCLAS_ENTRIES;
  const selIdx=TIPO_SELECCIONADO?entries.findIndex(e=>e[0]===TIPO_SELECCIONADO):-1;
  inst.off('click');
  inst.clear();
  inst.setOption({
    textStyle:{fontFamily:ECH_FONT,color:DS.g7},
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:function(v){return formatNum(v);}},
    grid:{left:8,right:20,top:8,bottom:8,containLabel:true},
    xAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(0,0,0,.05)'}},axisLabel:{fontSize:11}},
    yAxis:{type:'category',inverse:true,
      data:entries.map(function(e,i){return (i+1)+'. '+e[0];}),
      axisTick:{show:false},axisLine:{show:false},
      axisLabel:{fontSize:11,width:160,overflow:'truncate'}},
    series:[{type:'bar',barMaxWidth:18,
      label:{show:true,position:'right',formatter:function(p){return formatNum(p.value);},fontSize:11,color:DS.g7},
      itemStyle:{borderRadius:[0,6,6,0]},
      data:entries.map(function(e,i){return {value:e[1],itemStyle:{color:i===selIdx?DS.accent:DS.primary}};})}]
  });
  inst.on('click',onSubclasClick);
}

function onSubclasClick(params){
  if(!params||params.dataIndex===undefined)return;
  const idx=params.dataIndex;
  const tipo=SUBCLAS_ENTRIES[idx][0];
  TIPO_SELECCIONADO = (TIPO_SELECCIONADO===tipo)?null:tipo;
  applySubclas();
  renderMap(getSectorData());
}

function renderMap(s){
  const el=document.getElementById('mapa-ubicaciones');
  if(!el)return;
  if(!window.L){ el.innerHTML='<div class="ml" style="padding:12px;">Cargando mapa…</div>'; return; }
  const pts=MAPA_PUNTOS.filter(p=>(!s||p.sector===s.id)&&(!TIPO_SELECCIONADO||p.tipo===TIPO_SELECCIONADO));
  if(!mapInstance){
    mapInstance=L.map(el,{scrollWheelZoom:false}).setView([-12.1389,-77.0227],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(mapInstance);
    markerLayer=L.layerGroup().addTo(mapInstance);
  }
  markerLayer.clearLayers();
  if(!pts.length){
    mapInstance.setView([-12.1389,-77.0227],13);
    return;
  }
  const colorMap={};
  pts.forEach(function(p){ if(!colorMap[p.tipo])colorMap[p.tipo]=hashColor(p.tipo,SECTOR_COLORS); });
  pts.forEach(function(p){
    const color=colorMap[p.tipo];
    L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="punto-delito" style="--pd-c:'+color+'"><svg class="pin-body" viewBox="0 0 24 34" width="24" height="34"><path d="M12 0C5.4 0 0 5.4 0 12c0 8.5 10.5 21 12 22 1.5-1 12-13.5 12-22C24 5.4 18.6 0 12 0z" fill="var(--pd-c)" stroke="#fff" stroke-width="2.5"/><circle cx="12" cy="12" r="8" fill="#fff"/></svg><span class="pin-icon">'+iconoSvg(tipoIcono(p.tipo),14)+'</span></div>',iconSize:[24,34],iconAnchor:[12,33],tooltipAnchor:[0,-32]})})
      .bindTooltip(p.tipo,{direction:'top'})
      .addTo(markerLayer);
  });
  mapInstance.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[20,20]});
}

function renderPersonal(s,sup){
  const d=s||{};
  const supsRaw=s?d.supervisores:SECTORES.flatMap(x=>x.supervisores.map(p=>({...p,n:x.sector.replace('Sector ','')+' '+p.n,sec:x.sector.replace('Sector ','')})));
  const avgAst=supsRaw.length?Math.round(supsRaw.reduce((a,p)=>a+p.ast,0)/supsRaw.length):0;
  document.getElementById('p-asist').textContent=sup?(sup.sup?.ast||0)+'%':avgAst+'%';
  document.getElementById('p-tard').textContent='—';
  document.getElementById('p-disc').textContent='—';
  document.getElementById('p-rot').textContent='—';
  const allSups=sup?supsRaw.filter(p=>p.n.includes(sup.sup?.n)):supsRaw;
  document.getElementById('rank-asistencia').innerHTML=allSups.sort((a,b)=>b.ast-a.ast).slice(0,8).map(p=>{
    const cls=p.ast>=95?'verde':p.ast>=85?'amarillo':'rojo';
    const hl=sup?' style="background:var(--cpl);border-radius:var(--rmd);padding:4px 6px;"':'';
    return '<div class="prog-row"' + hl + '><span class="prog-name">' + p.n + '</span>' +
      '<div class="prog-track"><div class="prog-bar ' + cls + '"></div></div>' +
      '<span class="prog-val">' + p.ast + '%</span></div>';
  }).join('');
  const turnoAvg=m=>{
    const match=supsRaw.filter(p=>p.n.includes(m));
    return match.length?Math.round(match.reduce((a,p)=>a+p.ast,0)/match.length):0;
  };
  const instTurnos=getChart('turnos',document.getElementById('chartTurnos'));
  instTurnos.clear();
  instTurnos.setOption({
    textStyle:{fontFamily:ECH_FONT,color:DS.g7},
    tooltip:{trigger:'axis',valueFormatter:function(v){return v+'%';}},
    grid:{left:8,right:16,top:16,bottom:8,containLabel:true},
    xAxis:{type:'category',data:['Turno Mañana','Turno Tarde','Turno Noche'],axisTick:{show:false},axisLine:{lineStyle:{color:'rgba(0,0,0,.1)'}},axisLabel:{fontSize:11}},
    yAxis:{type:'value',min:70,max:100,splitLine:{lineStyle:{color:'rgba(0,0,0,.05)'}},axisLabel:{fontSize:11}},
    series:[{type:'bar',barMaxWidth:42,itemStyle:{borderRadius:[6,6,0,0]},
      data:[{value:turnoAvg('(M)'),itemStyle:{color:DS.primary}},
            {value:turnoAvg('(T)'),itemStyle:{color:DS.primary+'BB'}},
            {value:turnoAvg('(N)'),itemStyle:{color:DS.primary+'88'}}]}]
  });
  const rendRaw=s?d.rendimiento:SECTORES.flatMap(x=>x.rendimiento.map(r=>({...r,sup:x.sector.replace('Sector ','')+' '+r.sup,sec:x.sector.replace('Sector ','')})));
  const allRend=sup?rendRaw.filter(r=>r.sup.includes(sup.rend?.sup)):rendRaw;
  const tbl=document.getElementById('tbl-rendimiento');
  tbl.innerHTML = '<thead><tr>' +
    '<th>' + (s?'':'Sector ') + 'Supervisor</th><th class="num">Rutas %</th><th class="num">Reportes %</th>' +
    '<th class="num">Actitud</th><th class="num">Puntaje Total</th><th>Semáforo</th>' +
  '</tr></thead><tbody>' + allRend.slice(0,10).map(function(r){
    const cls=r.total>=90?'verde':r.total>=75?'amarillo':'rojo';
    return '<tr><td>' + r.sup + '</td><td class="num">' + r.rutas + '</td><td class="num">' + r.reportes + '</td>' +
      '<td class="num">' + r.actitud + '</td><td class="num"><strong>' + r.total + '</strong></td>' +
      '<td><span class="status-badge ' + cls + '"><span class="dot ' + cls + '"></span>' + statusLabel(cls)[1] + '</span></td></tr>';
  }).join('') + '</tbody>';
}

function buildSupervisores(sectores, supRows){
  var supData={};
  supRows.forEach(function(r){
    if(!supData[r.sector])supData[r.sector]=[];
    supData[r.sector].push(r);
  });
  sectores.forEach(function(sec){
    var rows=supData[sec.id]||[];
    if(rows.length===0)return;
    var turnoMap={};
    rows.forEach(function(r){
      var t=(r.turno||'').toUpperCase();
      var key=t.indexOf("M")!==-1?"M":t.indexOf("T")!==-1?"T":t.indexOf("N")!==-1?"N":"X";
      if(!turnoMap[key])turnoMap[key]={names:{},count:0};
      turnoMap[key].names[r.supervisor]=(turnoMap[key].names[r.supervisor]||0)+r.partes;
      turnoMap[key].count++;
    });
    var newSups=[];
    ["M","T","N"].forEach(function(tk){
      var td=turnoMap[tk];
      if(!td||Object.keys(td.names).length===0)return;
      var bestName="",bestPartes=0;
      Object.keys(td.names).forEach(function(nm){if(td.names[nm]>bestPartes){bestPartes=td.names[nm];bestName=nm;}});
      if(!bestName)return;
      var partesAvg=Math.round((bestPartes/td.count)*22);
      var ast=Math.min(100,Math.max(60,partesAvg));
      newSups.push({n:bestName+" ("+tk+")",ast:ast});
    });
    if(newSups.length>0){
      sec.supervisores=newSups;
      sec.rendimiento=newSups.map(function(p){return{
        sup:p.n,rutas:Math.min(100,Math.max(60,Math.round(p.ast*0.95))),
        reportes:Math.min(100,Math.max(60,Math.round(p.ast*0.90))),
        actitud:Math.min(100,Math.max(60,Math.round(p.ast*0.85))),
        total:Math.round((p.ast*0.95+p.ast*0.90+p.ast*0.85)/3)
      };});
    }
  });
}

function finishLoad(sectoresData, supRows, fStart, fEnd, ubicaciones){
  SECTORES=sectoresData.map(s => ({
    id: s.id,
    nombre: s.nombre,
    sector: s.sector_display,
    initials: s.initials,
    incTotal: s.incTotal,
    tasaResp: Math.round(parseFloat(s.tasaResp)*10)/10,
    comisarias: s.comisarias || [],
    franjas: s.franjas,
    tiposDelito: s.tiposDelito || {},
    subclas: s.subclas || {},
    frustrados: s.robosFrustrados,
    robosFrustrados: s.robosFrustrados,
    operativosCount: s.operativosCount,
    coordVecinales: s.coordVecinales,
    capturas: s.capturas,
    patrullajeCount: s.patrullajeCount,
    supervisores: [], // Will be filled by buildSupervisores
    rendimiento: []   // Will be filled by buildSupervisores
  }));

  buildSupervisores(SECTORES,supRows||[]);
  computeThresholds();
  MAPA_PUNTOS = ubicaciones || [];
  document.getElementById('loading-overlay').style.display='none';
  updateDash();
  lucide.createIcons();
}

function loadData(){
  document.getElementById('loading-overlay').style.display='flex';

  var fStart = document.getElementById('fechaInicio').value;
  var fEnd = document.getElementById('fechaFin').value;

  var pDashboardData = supabaseClient.rpc('get_dashboard_sectors', {
    p_fecha_inicio: fStart || null,
    p_fecha_fin: fEnd || null,
    p_turno_filter: TURNO_FILTER
  }).then(function(res){
    if(res.error)throw new Error('Error Supabase RPC: '+res.error.message);
    return res.data;
  });

  var pUbicaciones = supabaseClient.rpc('get_delitos_ubicaciones', {
    p_fecha_inicio: fStart || null,
    p_fecha_fin: fEnd || null,
    p_turno_filter: TURNO_FILTER
  }).then(function(res){
    return res.error ? [] : (res.data || []);
  });

  Promise.all([pDashboardData, pUbicaciones]).then(function(results){
    var sectoresData=results[0];
    var ubicaciones=results[1];

    google.script.run
      .withSuccessHandler(function(supData){
        if(supData&&!supData.error){
          CACHED_SUPERVISORS=supData.supervisores||[];
        }else{
          console.warn('Supervisores:',supData?.error||'sin datos');
          CACHED_SUPERVISORS=[];
        }
        finishLoad(sectoresData,CACHED_SUPERVISORS,fStart,fEnd,ubicaciones);
      })
      .withFailureHandler(function(err){
        console.warn('Error GAS supervisores:',err);
        CACHED_SUPERVISORS=[];
        finishLoad(sectoresData,[],fStart,fEnd,ubicaciones);
      })
      .getSupervisoresData(fStart,fEnd);

  }).catch(function(err){
    alert(err.message||'Error al cargar datos');
    document.getElementById('loading-overlay').style.display='none';
  });
}

function onFechaChange(){
  loadData();
}

function clearFilters(){
  CURRENT_SECTOR_ID='0';
  document.getElementById('selSup').value='0';
  TURNO_FILTER=null;
  setDefaultDates();
  loadData();
}

function setDefaultDates(){
  var today=new Date();
  var fmtD=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  document.getElementById('fechaInicio').value='2026-01-01';
  document.getElementById('fechaFin').value=fmtD(today);
}

window.addEventListener('load',function(){
  setDefaultDates();
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  loadData();
});
</script>
